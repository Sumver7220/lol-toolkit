name: release

# 推 v* tag 時建置 Windows 執行檔並發佈 Release。
# workflow_dispatch 供不打 tag 的試跑，此時只建置、不發佈。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: 安裝相依
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: 跑測試
        run: pytest -q

      # tag 名與 loltk.__version__ 對不上就中止，避免發出版本號自相矛盾的 Release。
      - name: 核對版本號
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $ver = python -c "import loltk; print(loltk.__version__)"
          if ($tag -ne $ver) {
            Write-Error "tag v$tag 與 loltk/__init__.py 的 $ver 不一致"
            exit 1
          }
          Write-Host "版本號一致：$ver"

      - name: 打包執行檔
        run: pyinstaller loltk.spec

      # 建出來的 exe 至少要能起得來。CI 上沒有《英雄聯盟》客戶端，
      # 所以只驗 --version 這條不需要 LCU 的路徑。
      - name: 冒煙測試
        run: |
          $out = & .\dist\loltk.exe --version
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 上傳建置產物
        uses: actions/upload-artifact@v5
        with:
          name: loltk-exe
          path: dist/loltk.exe

      - name: 發佈 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/loltk.exe --title "${{ github.ref_name }}" --generate-notes
